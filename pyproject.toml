[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxi-scale-lab"
version = "0.1.0"
description = "A bounded, auditable CPU dataframe benchmark and NYC taxi fare ML study."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nuno Antunes" }]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<2.4",
  "psutil>=5.9,<8",
  "pyarrow>=15,<22",
  "scikit-learn>=1.5,<1.8",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dask = ["dask[dataframe,distributed]>=2024.8,<2026"]
modin = ["modin[dask]>=0.32,<0.38"]
spark = ["pyspark>=3.5.3,<3.6", "numpy<2"]
dev = ["nbformat>=5.10,<6", "pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
taxi-lab = "taxi_scale_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_scale_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebooks.py" = ["E501"]
